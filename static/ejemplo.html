<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script src="/theme-init.js"></script>
  <title>ALVEA — Visor Standalone: Crédito de Consumo Móvil</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-section">
      <div class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="9" y2="12"></line>
          <line x1="15" y1="12" x2="21" y2="12"></line>
          <polygon points="12 9 15 12 12 15 9 12"></polygon>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </div>
      <div>
        <div class="brand-title-row">
          <span class="brand-name">ALVEA</span>
          <span class="badge badge--brand">Visor Standalone</span>
        </div>
        <p class="brand-subtitle">Ejemplo Ejecutivo: Crédito de Consumo Móvil (graph LR)</p>
      </div>
    </div>

    <div class="header-actions">
      <div class="zoom-group" role="group" aria-label="Controles de zoom">
        <button class="zoom-btn" id="sa-zoom-out" type="button">−</button>
        <span class="zoom-value tabular-nums" id="sa-zoom-label">100%</span>
        <button class="zoom-btn" id="sa-zoom-in" type="button">+</button>
        <button class="zoom-btn" id="sa-zoom-reset" type="button">1:1</button>
        <button class="zoom-btn" id="sa-zoom-fit" type="button">Ajustar</button>
      </div>
      <button class="btn btn-outline btn-sm" id="sa-copy" type="button">Copiar Mermaid</button>
      <button class="btn btn-outline btn-sm" id="sa-svg" type="button">SVG</button>
      <button class="btn btn-outline btn-sm" id="sa-png" type="button">PNG HD</button>
      <a class="btn btn-primary btn-sm" href="/">Abrir Estudio Completo</a>
    </div>
  </header>

  <main class="view-pane canvas-pane" id="sa-canvas">
    <div class="diagram-viewport" id="sa-viewport">
      <div class="diagram-sheet" id="sa-stage"></div>
    </div>
  </main>

  <!-- Fuente Mermaid aislada en script type="text/plain": protege < y > y permite copiar el código exacto siempre -->
  <script type="text/plain" id="mermaid-source">
graph LR
    classDef standard fill:#f8fafc,stroke:#94a3b8,stroke-width:1.5px,color:#0f172a,rx:8,ry:8;
    classDef startNode fill:#dcfce7,stroke:#16a34a,stroke-width:2px,color:#14532d,rx:20,ry:20;
    classDef endNode fill:#fee2e2,stroke:#dc2626,stroke-width:2px,color:#7f1d1d,rx:20,ry:20;
    classDef endSuccess fill:#dcfce7,stroke:#15803d,stroke-width:2px,color:#14532d,rx:20,ry:20;
    classDef decision fill:#fef9c3,stroke:#d97706,stroke-width:2px,color:#713f12;

    subgraph CLI["Cliente"]
        C1(["Inicio: Solicita crédito en App Móvil"]):::startNode
        C2["Recibe notificación de rechazo"]:::standard
        C3["Firma digitalmente el contrato"]:::standard
        C_END_REC(["Fin: Solicitud rechazada"]):::endNode
        C_END_EXITO(["Fin: Crédito desembolsado exitosamente"]):::endSuccess
    end

    subgraph SYS["Sistema / App Móvil"]
        S1["Consulta automática de score en buró"]:::standard
        D1{"¿Score ≥ 600?"}:::decision
        S2["Rechaza crédito automáticamente"]:::standard
        S3["Ejecuta desembolso final"]:::standard
    end

    subgraph RIE["Analista de Riesgos"]
        R1["Revisión manual de ingresos"]:::standard
        D2{"¿Ingresos aprobados?"}:::decision
    end

    subgraph LEG["Área Legal"]
        L1["Redacción de contrato de crédito"]:::standard
    end

    C1 --> S1
    S1 --> D1
    D1 -- "Score < 600" --> S2
    D1 -- "Score ≥ 600" --> R1
    S2 --> C2
    C2 --> C_END_REC
    R1 --> D2
    D2 -- "Rechazado" --> S2
    D2 -- "Aprobado" --> L1
    L1 --> C3
    C3 --> S3
    S3 --> C_END_EXITO
  </script>

  <div class="toast-container" id="sa-toasts" aria-live="polite"></div>

  <script src="/vendor/mermaid.min.js" defer></script>
  <script src="/ejemplo.js" defer></script>
</body>
</html>
